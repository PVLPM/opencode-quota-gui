pre-commit:
  commands:
    biome:
      glob: "**/*.{js,cjs,mjs,jsx,ts,tsx,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

pre-push:
  commands:
    verify:
      run: pnpm verify

post-checkout:
  commands:
    codegraph:
      run: node scripts/init-worktree-codegraph.mjs {1} {2} {3}
