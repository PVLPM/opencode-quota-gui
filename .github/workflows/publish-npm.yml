name: Publish to npm (manual tag dispatch)

# Manual-only release path (stabilization plan item 2 / R45). Nothing here runs on
# release events, tag pushes, schedules, or repository pushes. A maintainer dispatches
# this workflow with an existing tag; `publish` defaults to false so a rehearsal only
# verifies and packs. The `publish` job only SUBMITS the verified tarball to npm Staged
# Packages (it never publishes publicly) and additionally requires the repository
# variable NPM_PUBLISH_ENABLED to be exactly 'true'. The final public release is a
# separate owner step: Approve + 2FA on npmjs.com. The npm trusted publisher must allow
# `npm stage publish` only (direct publishing and dist-tag changes stay disabled). No job creates or
# moves a tag, rewrites
# package.json, backfills a branch, or reassigns npm tags: the tag and the package
# version must already match the checked-out commit.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to verify and (when confirmed) stage, e.g. v1.0.0"
        required: true
        type: string
      publish:
        description: "Submit the verified tarball to npm Staged Packages (explicit confirmation; owner approves publicly on npmjs.com)"
        required: true
        type: boolean
        default: false

env:
  PACKAGE_NAME: opencode-quota-gui

jobs:
  release-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.0 --activate

      - name: Assert tag, commit, and package version match
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "A release tag input is required." >&2
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}" >/dev/null; then
            echo "Tag '$RELEASE_TAG' does not exist in this repository." >&2
            exit 1
          fi

          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [ "$CHECKED_OUT_SHA" != "$TAG_SHA" ]; then
            echo "Checked-out commit $CHECKED_OUT_SHA does not match tag $RELEASE_TAG ($TAG_SHA)." >&2
            exit 1
          fi

          pnpm run verify:release-version

          # The dispatch ref (main) may be newer than the release tag, so the
          # workflow-provided commit variable is not the release identity. Pin the
          # build identity to the verified tag commit for every later step.
          echo "OPENCODE_QUOTA_BUILD_SHA=$TAG_SHA" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run canonical verification
        run: pnpm verify

      - name: Pack and audit the release artifact once
        run: pnpm run pack:release-package package-artifacts

      - name: Upload exact release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: package-artifacts/*
          if-no-files-found: error

  runtime-smoke:
    runs-on: ubuntu-latest
    needs: release-package

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download exact release artifact
        uses: actions/download-artifact@v8
        with:
          name: release-package
          path: package-artifacts

      - name: Smoke exact release artifact on Node ${{ matrix.node-version }}
        run: node scripts/smoke-packed-package.mjs package-artifacts

  publish:
    name: Submit to npm staging (owner approves on npmjs.com)
    runs-on: ubuntu-latest
    needs: [release-package, runtime-smoke]
    # Staging needs both the repository opt-in variable and an explicit dispatch
    # confirmation; the input defaults to false.
    if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' && inputs.publish == true }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Setup Node.js 24 for npm
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Require npm CLI 11.15.0 or newer for staged publishing
        run: |
          npm install --global npm@11
          NPM_VERSION="$(npm --version)"
          echo "Using npm $NPM_VERSION"
          node -e 'const [major, minor] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && minor < 15)) { console.error("npm stage publish needs npm >= 11.15.0, found " + process.argv[1]); process.exit(1); }' "$NPM_VERSION"

      - name: Download exact release artifact
        uses: actions/download-artifact@v8
        with:
          name: release-package
          path: package-artifacts

      - name: Choose npm dist-tag
        id: dist-tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          case "$VERSION" in
            *-*) DIST_TAG="next" ;;
            *) DIST_TAG="latest" ;;
          esac
          echo "Staging $PACKAGE_NAME@$VERSION with the npm '$DIST_TAG' dist-tag (not public until the owner approves on npmjs.com)"
          echo "dist-tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Verify and submit exact release artifact to npm staging
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.dist-tag }}
        run: |
          node scripts/verify-release-artifact.mjs package-artifacts
          TARBALLS=(package-artifacts/*.tgz)
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "Expected exactly one release tarball." >&2
            exit 1
          fi
          npm stage publish "./${TARBALLS[0]}" --tag "$DIST_TAG" --access public --provenance --ignore-scripts
          echo "Staged only. Review and Approve (2FA) on npmjs.com to release publicly."
