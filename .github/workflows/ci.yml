name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pnpm-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run canonical verification
        run: pnpm verify

      - name: Run advisory Oxlint anti-slop report
        id: oxlint-advisory
        continue-on-error: true
        run: pnpm run lint:oxlint

      - name: Surface advisory Oxlint outcome
        if: ${{ steps.oxlint-advisory.outcome == 'failure' }}
        run: |
          echo "::warning title=Oxlint advisory::Oxlint anti-slop findings remain on strict paths; advisory only, never a release blocker. See docs/readme/release.md."

      - name: Run advisory Knip dead-code report
        continue-on-error: true
        run: pnpm run knip

      - name: Pack and audit exact npm artifact once
        run: pnpm run pack:release-package package-artifacts

      - name: Upload exact npm artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-tarball
          path: package-artifacts/*
          if-no-files-found: error

  windows-platform:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only Windows-sensitive filesystem, storage, updater and loopback coverage.
      # Lint, typecheck, build, history and package-content gates are OS-independent
      # and already run once in pnpm-quality.
      - name: Windows platform-specific tests
        run: pnpm run test:windows-platform

  runtime-smoke:
    runs-on: ubuntu-latest
    needs: pnpm-quality

    steps:
      - uses: actions/checkout@v6

      - name: Download exact npm artifact
        uses: actions/download-artifact@v8
        with:
          name: package-tarball
          path: package-artifacts

      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Smoke exact npm artifact on Node 22.x
        run: node scripts/smoke-packed-package.mjs package-artifacts

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Smoke exact npm artifact on Node 24.x
        run: node scripts/smoke-packed-package.mjs package-artifacts
