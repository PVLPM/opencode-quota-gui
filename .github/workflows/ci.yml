name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Keep the required check names, but don't spend runner minutes on documentation-only PRs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect documentation-only changes
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Fail open into the full test suite if the diff cannot be established.
          paths_file="$RUNNER_TEMP/ci-changed-paths.z"
          if ! git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$paths_file"; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Could not classify the diff; running full CI."
            exit 0
          fi

          docs_only=true
          changed=false
          while IFS= read -r -d '' path; do
            changed=true
            case "$path" in
              docs/*|images/*)
                case "$path" in
                  *.md|*.mdx|*.txt|*.rst|*.adoc|*.png|*.jpg|*.jpeg|*.gif|*.webp|*.svg|*.pdf) ;;
                  *) docs_only=false ;;
                esac
                ;;
              .github/ISSUE_TEMPLATE/*|.github/DISCUSSION_TEMPLATE/*)
                case "$path" in
                  *.md|*.yml|*.yaml|*.txt) ;;
                  *) docs_only=false ;;
                esac
                ;;
              .github/PULL_REQUEST_TEMPLATE.md) ;;
              *)
                if [[ "$path" == */* ]]; then
                  docs_only=false
                else
                  case "$path" in
                    *.md|*.mdx|*.txt|*.rst|*.adoc|LICENSE|LICENSE.*|NOTICE|NOTICE.*|COPYING|COPYING.*) ;;
                    *) docs_only=false ;;
                  esac
                fi
                ;;
            esac
            if [[ "$docs_only" == false ]]; then
              break
            fi
          done < "$paths_file"

          if [[ "$changed" == false ]]; then
            docs_only=false
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Documentation-only: $docs_only"

  pnpm-quality:
    needs: changes
    # A failed classifier cannot bypass quality checks.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Diagnose changed CI test formatting
        run: pnpm exec biome check tests/package-manifest.test.ts --max-diagnostics=10

      - name: Run canonical verification
        run: pnpm verify

      - name: Run advisory Oxlint anti-slop report
        id: oxlint-advisory
        continue-on-error: true
        run: pnpm run lint:oxlint

      - name: Surface advisory Oxlint outcome
        if: ${{ steps.oxlint-advisory.outcome == 'failure' }}
        run: |
          echo "::warning title=Oxlint advisory::Oxlint anti-slop findings remain on strict paths; advisory only, never a release blocker. See docs/readme/release.md."

      - name: Run advisory Knip dead-code report
        continue-on-error: true
        run: pnpm run knip

      - name: Pack and audit exact npm artifact once
        run: pnpm run pack:release-package package-artifacts

      - name: Upload exact npm artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-tarball
          path: package-artifacts/*
          if-no-files-found: error

  windows-platform:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only Windows-sensitive filesystem, storage, updater and loopback coverage.
      # Lint, typecheck, build, history and package-content gates are OS-independent
      # and already run once in pnpm-quality.
      - name: Windows platform-specific tests
        run: pnpm run test:windows-platform

  runtime-smoke:
    needs: [changes, pnpm-quality]
    # Don't try to smoke a missing artifact on docs-only changes or failed quality checks.
    if: ${{ !cancelled() && needs.pnpm-quality.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Download exact npm artifact
        uses: actions/download-artifact@v8
        with:
          name: package-tarball
          path: package-artifacts

      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Smoke exact npm artifact on Node 22.x
        run: node scripts/smoke-packed-package.mjs package-artifacts

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Smoke exact npm artifact on Node 24.x
        run: node scripts/smoke-packed-package.mjs package-artifacts
