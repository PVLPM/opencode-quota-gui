name: Bug report
description: Report a reproducible bug in opencode-quota-gui
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        This package is GUI-only and requires OpenCode 2. OpenCode 1 is not supported; use the upstream `@slkiser/opencode-quota` project for that line.

  - type: dropdown
    id: opencode_line
    attributes:
      label: Which OpenCode do you use?
      options:
        - OpenCode 2
        - OpenCode 1
    validations:
      required: true

  - type: input
    id: opencode_version
    attributes:
      label: Your OpenCode version
      description: Example `2.0.20`
      placeholder: 2.0.20
    validations:
      required: true

  - type: input
    id: plugin_version
    attributes:
      label: Your plugin version
      description: Open dashboard Settings → About and copy the Version. If it has `beta` in it, update first, because it may already be fixed.
      placeholder: 1.0.0
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
      description: What did you expect, and what happened instead? Screenshots help. Drag them into this box.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How can we make it happen?
      description: List the steps. Include any commands you typed and your settings.
      placeholder: |
        1. I set up ...
        2. I typed ...
        3. I saw ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Paste safe dashboard or OpenCode log details (optional)
      description: Copy only the safe error text and the Version, Build, and Contract from Settings → About. Do not paste credentials, account identifiers, private paths, or raw provider responses.
      render: shell
