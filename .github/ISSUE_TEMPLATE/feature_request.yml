name: Feature request
description: Propose a new feature or behavior change
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Ideas that change what you see on screen are welcome in this repository's issues.

        Something broken? Use **Bug report**.

        New provider? Use **Provider request**.

  - type: dropdown
    id: display_change
    attributes:
      label: Does this change what you see on screen?
      description: For example a new row, color, or layout on the dashboard, or a change to the local settings page.
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true

  - type: input
    id: opencode_version
    attributes:
      label: Your OpenCode version
      description: Example `2.0.20`
      placeholder: 2.0.20
    validations:
      required: true

  - type: input
    id: plugin_version
    attributes:
      label: Your plugin version
      description: Open dashboard Settings → About and copy the Version. If it has `beta` in it, update first, because it may already work.
      placeholder: 1.0.0
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: A sketch or screenshot helps. Drag it into this box.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Other ideas you thought about (optional)
